name: Scan Music Library

on:
  push:
    paths:
      - 'assets/music/**'
      - 'tools/scan.js'
      - '.github/workflows/scan-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # اطمینان از دسترسی نوشتن با استفاده از توکن پیش‌فرض
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # ارتقا به نسخه ۲۲ (LTS) برای رفع هشدار منسوخ شدن نسخه ۲۰
          node-version: '22'

      - name: Run scan
        run: node tools/scan.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library.auto.json
          
          # بررسی اینکه آیا تغییری وجود دارد یا خیر
          if ! git diff --staged --quiet; then
            git commit -m "Update library.auto.json [skip ci]"
            
            # همگام‌سازی با مخزن اصلی برای جلوگیری از خطای 128
            git pull --rebase origin ${{ github.ref_name }}
            
            git push
          else
            echo "No changes detected. Skipping commit and push."
          fi
