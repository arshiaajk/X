name: Scan Music Library

on:
  push:
    paths:
      - 'assets/music/**'
      - 'tools/scan.js'
      - '.github/workflows/scan-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # ارتقا برای رفع هشدار Node.js 20

      - name: Setup Node.js
        uses: actions/setup-node@v7 # ارتقا برای رفع هشدار Node.js 20
        with:
          node-version: '22'

      # در صورت نیاز اسکریپت به پکیج‌های خارجی، این مرحله را اضافه کنید
      # - name: Install dependencies
      #   run: npm ci

      - name: Run scan
        run: node tools/scan.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library.auto.json
          if ! git diff --staged --quiet; then
            git commit -m "Update library.auto.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
