name: Scan Music Library

on:
  push:
    paths:
      - 'assets/music/**'
      - 'tools/scan.js'
  workflow_dispatch:   # این باعث می‌شه دستی هم بتونی اجراش کنی

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        run: node tools/scan.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/library.auto.json
          git diff --staged --quiet || git commit -m "Update library.auto.json"
          git push
