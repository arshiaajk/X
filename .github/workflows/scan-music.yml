name: Scan Music Library

on:
  push:
    paths:
      - 'assets/library.json'
      - 'assets/music/**'
      - 'tools/scan.js'
      - 'tools/create-folders.js'
      - '.github/workflows/scan-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # برای جلوگیری از خطای Rebase در گیت

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Artist Folders
        run: node tools/create-folders.js

      - name: Run scan (Generate JSON)
        run: node tools/scan.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add assets/library.auto.json
          git add assets/music/
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-update folders and library [skip ci]"
            
            # مدیریت خطای احتمالی در همگام‌سازی با مخزن
            git fetch origin ${{ github.ref_name }}
            if ! git rebase origin/${{ github.ref_name }}; then
              echo "⚠️ Conflict detected. Resolving by keeping generated files..."
              git rebase --abort
              git pull origin ${{ github.ref_name }} --no-rebase -X ours
            fi
            
            git push origin HEAD:${{ github.ref_name }}
          fi
