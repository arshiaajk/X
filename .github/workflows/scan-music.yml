name: Scan Music Library

on:
  push:
    paths:
      - 'assets/library.json'
      - 'assets/music/**'
      - 'tools/scan.js'
      - '.github/workflows/scan-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check files exist
        run: ls -la tools/

      - name: Run Script
        run: node tools/scan.js

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update library [skip ci]"
            git push
          fi
