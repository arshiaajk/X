<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSX — Music Archive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;padding:35px 7% 140px;overflow-x:hidden}
body.sheet-open{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transform:translateZ(0);
  background:radial-gradient(circle at 10% 15%,rgba(255,140,170,.5),transparent 42%),radial-gradient(circle at 90% 28%,rgba(120,170,255,.5),transparent 44%),radial-gradient(circle at 25% 88%,rgba(140,230,200,.45),transparent 46%),radial-gradient(circle at 88% 92%,rgba(255,205,120,.42),transparent 42%),#fff}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:100px}
.logo{font-size:35px;font-weight:900;letter-spacing:9px;display:inline-flex}
.logo .l{display:inline-block;will-change:transform,opacity;animation:wave 3.2s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i)*-.4s)}
body.playing .logo .l{animation-name:wave2}
@keyframes wave{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-3px);opacity:1}}
@keyframes wave2{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-9px);opacity:1}}
main{max-width:900px;margin:auto}
.section-title{font-size:12px;letter-spacing:5px;margin-bottom:35px}
.empty{font-size:12px;color:#999;letter-spacing:1px;padding:20px 0}

/* search */
.search-wrap{position:relative;margin-bottom:22px}
#search{width:100%;border:1px solid #e8e8e8;border-radius:12px;padding:13px 46px 13px 18px;font-size:12px;letter-spacing:2px;font-family:inherit;color:#111;outline:none;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .3s,box-shadow .5s cubic-bezier(.34,1.56,.64,1)}
#search:focus{border-color:#111;box-shadow:0 0 0 4px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.08)}
#search::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:8px;top:50%;translate:0 -50%;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.07);color:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.clear:hover{background:#111;color:#fff}

/* buttons */
.view-more{background:rgba(255,255,255,.5);color:#111;border:1px solid #111;padding:11px 23px;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:12px;transition:transform .3s,background .25s,color .25s}
.view-more:hover,.view-more:focus-visible{background:#111;color:#fff}
.view-more:active{transform:scale(.95)}
.view-more.more-artists{display:block;width:100%;padding:16px;margin-top:24px;font-size:11px;border-radius:18px}

/* library button (header) */
.lib-btn{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#111;border:1px solid #111;padding:11px 18px;font-family:inherit;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:12px;transition:transform .3s,background .25s,color .25s}
.lib-btn:hover,.lib-btn:focus-visible{background:#111;color:#fff}
.lib-btn:active{transform:scale(.95)}
.lib-btn svg{flex-shrink:0}
.lib-count{font-size:9px;letter-spacing:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#111;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.lib-btn:hover .lib-count,.lib-btn:focus-visible .lib-count{background:#fff;color:#111}

/* artist cards */
.artist-group{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.08) 55%,rgba(255,255,255,.16));-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.03);backdrop-filter:blur(22px) saturate(190%) brightness(1.03);border:1px solid rgba(255,255,255,.7);border-radius:24px;box-shadow:0 8px 22px rgba(30,40,90,.13),inset 2px 2px 1px -1px rgba(255,255,255,.95),inset -2px -2px 1px -1px rgba(255,255,255,.55),inset 0 0 26px rgba(255,255,255,.22);margin-bottom:16px;padding:0 22px;transform:perspective(var(--persp)) rotateX(calc(var(--my,0)*var(--tilt)*-1)) rotateY(calc(var(--mx,0)*var(--tilt)));transition:scale .3s cubic-bezier(.34,1.56,.64,1)}
.artist-group:active{scale:.985}
.artist-group.fade-in{animation:fadeIn .5s ease-out backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.artist-card{display:flex;align-items:center;gap:25px;padding:22px 0;cursor:pointer}
.artist-photo{width:125px;height:125px;object-fit:cover;background:rgba(255,255,255,.5);flex-shrink:0;border-radius:16px}
.artist-info{flex:1;min-width:0}
.artist-info h3{font-size:19px;margin-bottom:9px}
.artist-info p{font-size:10px;color:#888;letter-spacing:2px;margin-bottom:18px}

/* tracks */
.track{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.07);content-visibility:auto;contain-intrinsic-size:auto 118px}
.cover{width:85px;height:85px;object-fit:cover;background:#eee;flex-shrink:0;border-radius:12px}
.ctrl{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ctrl button,.ctrl a.dl-btn{border:1px solid rgba(17,17,17,.3);background:rgba(255,255,255,.7);color:#111;cursor:pointer;font-size:10px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.ctrl button.play{width:42px;height:42px;font-size:14px}
.ctrl button:hover,.ctrl button:focus-visible,.ctrl a.dl-btn:hover{background:#111;color:#fff}
.ctrl button:active,.ctrl a.dl-btn:active{transform:scale(.9)}
.track-info{flex:1;min-width:0}
.track-info h4{font-size:14px;margin-bottom:7px}
.track-info p{font-size:10px;color:#888;margin-bottom:12px}
.plays{font-variant-numeric:tabular-nums;letter-spacing:1.5px;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:12px}
.time{font-size:10px;color:#888;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.album-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:30px 0 10px;padding-top:20px;border-top:1px solid rgba(0,0,0,.08)}
.album-heading h3{font-size:15px;letter-spacing:3px;margin-bottom:7px}
.album-heading p{font-size:10px;color:#888;letter-spacing:2px}
.album-heading .view-more{flex-shrink:0}
.album-tracks{max-height:472px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;animation:paneIn .35s ease both}
.top-results{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:6px 22px 10px;margin-bottom:16px;box-shadow:0 6px 22px rgba(30,40,90,.08)}
.top-label{font-size:10px;letter-spacing:4px;color:#888;padding:16px 0 4px}
.top-results .track:last-child{border-bottom:0}

/* like (heart) buttons */
.like svg{fill:none;stroke:currentColor;transition:fill .25s,stroke .25s}
.like.on svg{fill:#ff4d6d;stroke:#ff4d6d}
.like.pop svg{animation:heartPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* range sliders (one system: thumb is aligned with the fill, no overhang) */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:20px;margin:0;padding:0;background:transparent;outline:none;cursor:pointer;--f:0;--th:11px;--tk:3px;--on:#111;--off:#ddd}
input[type=range]:disabled{cursor:default;opacity:.6}
input[type=range]::-webkit-slider-runnable-track{height:var(--tk);border-radius:999px;background:linear-gradient(to right,var(--on) calc(var(--th)/2 + (100% - var(--th))*var(--f)),var(--off) 0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:var(--th);height:var(--th);margin-top:calc((var(--tk) - var(--th))/2);border-radius:50%;background:var(--on);border:0}
input[type=range]::-moz-range-track{height:var(--tk);border-radius:999px;background:var(--off)}
input[type=range]::-moz-range-progress{height:var(--tk);border-radius:999px;background:var(--on)}
input[type=range]::-moz-range-thumb{width:var(--th);height:var(--th);border-radius:50%;background:var(--on);border:0}

/* about / footer */
.about{border-top:1px solid #e8e8e8;margin-top:100px;padding-top:40px;margin-bottom:80px}
.about p{font-size:13px;line-height:2;color:#777;max-width:550px}
footer{text-align:center;border-top:1px solid #eee;padding-top:30px;font-size:10px;color:#999;letter-spacing:2px}
footer a{color:#111;text-decoration:none}

/* telegram */
.tg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,200%);opacity:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.tg.show{transform:translate(calc(-50% + var(--dx,0px)),0);opacity:1}
.tg.drag{transition:none}
.tg-link{display:flex;align-items:center;gap:12px;background:#fff;color:#111;text-decoration:none;border:1px solid #e8e8e8;border-radius:16px;padding:10px 20px 10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.08);white-space:nowrap;-webkit-user-drag:none}
.tg-ico{width:34px;height:34px;flex-shrink:0}
.tg-text b{display:block;font-size:11px;letter-spacing:3px}
.tg-text small{display:block;font-size:10px;color:#888;letter-spacing:1px;margin-top:4px}

/* mini player */
.mini-player{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;z-index:60;border-radius:30px;overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 34px rgba(30,40,80,.16),inset 0 1.5px 0 #fff;
  transform:translateY(150%);opacity:0;pointer-events:none;transition:transform .6s cubic-bezier(.2,1.1,.3,1),opacity .35s}
.mini-player.show{transform:none;opacity:1;pointer-events:auto}
.mini-inner{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mini-cover{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0}
.mini-info{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-artist{font-size:10px;color:#888;letter-spacing:1px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-range{--th:10px;--tk:4px;--off:rgba(0,0,0,.14);margin-top:2px}
.mini-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mini-ctrl button{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);color:#111;cursor:pointer;width:36px;height:36px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(0,0,0,.08);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.mini-ctrl .mini-play{width:42px;height:42px;font-size:14px}
.mini-ctrl .mini-close{width:30px;height:30px;background:rgba(0,0,0,.06);box-shadow:none;border-color:transparent}
.mini-ctrl button:hover,.mini-ctrl button:focus-visible{background:#111;color:#fff}
.mini-ctrl button:active{transform:scale(.9)}

/* full player */
.full-player{position:fixed;inset:0;z-index:100;background:#111;color:#fff;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(100%);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1);overflow:hidden;visibility:hidden}
.full-player.show{opacity:1;pointer-events:auto;transform:none;visibility:visible}
.fp-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.25) brightness(.85);transform:translateZ(0) scale(1.1);z-index:1}
.fp-bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.15)}
.fp-pulse{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;will-change:opacity;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),transparent 60%)}
.fp-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:40px 20px calc(30px + env(safe-area-inset-bottom,0px));max-width:600px;margin:0 auto;width:100%}
.fp-header{width:100%;display:flex;justify-content:space-between;align-items:center}
.fp-right{display:flex;align-items:center;gap:10px}
.fp-main{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:20px}
.fp-cover{width:75vw;max-width:320px;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 20px 40px rgba(0,0,0,.5);background:#222;will-change:transform}
.fp-info{text-align:center;margin-top:40px;width:100%}
.fp-title{font-size:24px;font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-artist{font-size:14px;color:#ccc;letter-spacing:1px}
.fp-bottom{width:100%}
.fp-bar{display:flex;flex-direction:column;gap:6px;margin-bottom:26px}
.fp-bar input[type=range]{--th:14px;--tk:6px;--on:#fff;--off:rgba(255,255,255,.25)}
.fp-bar input[type=range]::-webkit-slider-thumb{box-shadow:0 2px 8px rgba(0,0,0,.35)}
.fp-times{display:flex;justify-content:space-between;font-size:11px;color:#ccc;font-variant-numeric:tabular-nums}
.fp-close,.fp-dl,.fp-like,.fp-ctrl button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:50%;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 8px 24px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,opacity .25s}
.fp-close,.fp-dl,.fp-like{width:44px;height:44px}
.fp-close:hover,.fp-dl:hover,.fp-like:hover{background:rgba(255,255,255,.25)}
.fp-ctrl{display:flex;align-items:center;justify-content:center;gap:12px}
.fp-ctrl button{width:50px;height:50px}
.fp-ctrl button.fp-side{width:44px;height:44px;position:relative;opacity:.65}
.fp-ctrl button.fp-side.on{opacity:1;background:rgba(255,255,255,.38)}
.fp-ctrl button.fp-side[data-m="2"]::after{content:"1";position:absolute;font-size:9px;font-weight:700;top:50%;left:50%;translate:-50% -50%}
.fp-ctrl .fp-play{width:70px;height:70px;background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.55)}
.fp-ctrl button:hover{background:rgba(255,255,255,.3)}
.fp-ctrl button:active,.fp-close:active,.fp-dl:active,.fp-like:active{transform:scale(.9)}
.fp-ctrl svg{fill:currentColor}
.fp-ctrl svg.st{fill:none;stroke:currentColor}

/* artist sheet (also used by the library) */
.sheet{position:fixed;inset:0;z-index:55;visibility:hidden;pointer-events:none;transition:visibility 0s .5s}
.sheet.show{visibility:visible;pointer-events:auto;transition-delay:0s}
.sheet-back{position:absolute;inset:0;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .5s ease}
.sheet.show .sheet-back{opacity:1}
.sheet-panel{position:absolute;left:14px;right:14px;top:9vh;bottom:14px;max-width:640px;margin:0 auto;border-radius:38px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.46),rgba(255,255,255,.2));
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.04);backdrop-filter:blur(26px) saturate(190%) brightness(1.04);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 30px 80px rgba(40,60,120,.2),inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.5),inset 0 0 40px rgba(255,255,255,.35);
  opacity:0;translate:0 60px;scale:.94;
  transform:perspective(var(--persp)) rotateX(calc(var(--my,0)*var(--tilt-sheet)*-1)) rotateY(calc(var(--mx,0)*var(--tilt-sheet)));
  will-change:transform,translate,scale,opacity;
  transition:translate .45s cubic-bezier(.4,0,.6,1),scale .45s cubic-bezier(.4,0,.6,1),opacity .35s ease}
.sheet.show .sheet-panel{opacity:1;translate:none;scale:none;transition:translate .65s cubic-bezier(.2,1.1,.3,1),scale .65s cubic-bezier(.2,1.1,.3,1),opacity .4s ease}
.glass-btn{position:absolute;top:16px;right:16px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #fff;color:#111;cursor:pointer;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px) saturate(180%);backdrop-filter:blur(6px) saturate(180%);box-shadow:0 6px 20px rgba(0,0,0,.1),inset 0 1.5px 0 rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.glass-btn:active{transform:scale(.9)}
.sheet-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:30px 22px 130px}
.sheet-head{display:flex;flex-direction:column;align-items:center;text-align:center}
.sheet-photo{width:130px;height:130px;object-fit:cover;border-radius:32px;background:#eee;box-shadow:0 12px 30px rgba(0,0,0,.16)}
.sheet-head h3{font-size:22px;margin-top:18px}
.sheet-head p{font-size:10px;color:#666;letter-spacing:2px;margin-top:8px}
.sheet-head.lib h3{font-size:14px;letter-spacing:6px;margin-top:14px;padding-left:6px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:340px;margin:24px auto 14px;padding:4px;border-radius:999px;background:rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8)}
.seg button{position:relative;z-index:1;background:none;border:0;padding:12px 0;font-size:10px;letter-spacing:3px;color:#555;cursor:pointer;transition:color .3s}
.seg button[aria-selected=true]{color:#111;font-weight:700}
.seg-pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.1);transition:transform .45s cubic-bezier(.34,1.3,.64,1)}
.seg[data-t=albums] .seg-pill{transform:translateX(100%)}
.seg.one{grid-template-columns:1fr}
.seg.one .seg-pill{width:calc(100% - 8px);transform:none}
.pane{display:none}
.pane.on{display:block;animation:paneIn .35s ease both}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:600px){
  body{padding:25px 6% 130px}
  header{margin-bottom:70px}
  .logo{font-size:27px}
  .lib-btn{padding:10px 14px;gap:8px;letter-spacing:2px}
  .artist-card{gap:15px}
  .artist-photo{width:95px;height:95px}
  .artist-info h3{font-size:15px}
  .track{flex-wrap:wrap;gap:12px}
  .cover{width:72px;height:72px}
  .track-info{flex:1 1 calc(100% - 90px)}
  .ctrl{order:3;width:100%;justify-content:center;gap:10px}
  .time{min-width:70px}
  .mini-inner{padding:10px 12px;gap:10px}
  .mini-cover{width:38px;height:38px}
  .mini-ctrl{gap:6px}
  .mini-ctrl button{width:32px;height:32px}
  .mini-ctrl .mini-play{width:38px;height:38px}
  .mini-ctrl .mini-close{width:28px;height:28px}
  .sheet-panel{left:10px;right:10px;top:7vh;bottom:10px;border-radius:32px}
  .sheet-scroll{padding:26px 16px 130px}
  .album-tracks{max-height:600px}
  .fp-ctrl{gap:8px}
  .fp-ctrl button{width:46px;height:46px}
  .fp-ctrl button.fp-side{width:40px;height:40px}
  .fp-ctrl .fp-play{width:66px;height:66px}
}
/* motion layers: only transform changes (compositor), never repaint */
:root{--tilt:6deg;--tilt-sheet:4deg;--persp:800px}
.artist-group.live{will-change:transform}
.artist-group::before,.artist-group::after,.sheet-panel::before,.sheet-panel::after{content:"";position:absolute;inset:-30%;pointer-events:none}
.artist-group::before,.sheet-panel::before{z-index:1;
  background:linear-gradient(115deg,transparent 22%,rgba(255,255,255,.34) 36%,rgba(255,255,255,.06) 46%,transparent 56%,transparent 70%,rgba(255,255,255,.16) 80%);
  transform:translate(calc(var(--mx,0)*-9%),calc(var(--my,0)*-9%))}
.artist-group::after,.sheet-panel::after{display:none}
/* the glossy sheen over photos exists only while motion is actually running */
.artist-group::before,.sheet-panel::before{display:none}
html.motion .artist-group::before,html.motion .sheet-panel::before{display:block}
.artist-group.live::before,.artist-group.live::after,.sheet.show .sheet-panel::before,.sheet.show .sheet-panel::after{will-change:transform}
.artist-group .view-more{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.artist-group .view-more:hover,.artist-group .view-more:focus-visible,.sheet-panel .view-more:hover{background:#111;color:#fff}

<div class="full-player" id="fullPlayer" aria-hidden="true">

            </button>
            <div class="fp-right">
                <button type="button" class="fp-like like" id="fpLike" aria-label="Like this track">
                    <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.3l7.8-7.8 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                </button>
                <a class="fp-dl" id="fpDl" href="#" aria-label="Download track">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </a>
            </div>
        </div>
        <div class="fp-main">
            <img class="fp-cover" id="fpCover" alt="">
            <div class="fp-info">
                <div class="fp-title" id="fpTitle">-</div>

            </div>
        </div>
        <div class="fp-bottom">
            <div class="fp-bar">
                <input type="range" id="fpRange" min="0" max="1000" value="0" aria-label="Seek">
                <div class="fp-times"><span id="fpTimeCur">0:00</span><span id="fpTimeTot">0:00</span></div>
            </div>
            <div class="fp-ctrl">
                <button class="fp-side" id="fpRepeat" data-m="0" aria-label="Repeat" aria-pressed="false">
                    <svg class="st" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>

                    <svg width="28" height="28" viewBox="0 0 24 24" id="fpPlayIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="fpNext" aria-label="Next track">
                    <svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="fp-side" id="fpShuffle" aria-label="Shuffle" aria-pressed="false">
                    <svg class="st" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const url=p=>p?"./assets/"+String(p).split("/").map(encodeURIComponent).join("/"):"";
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const fill=r=>r.style.setProperty("--f",r.value/1000);

/* ---------- visitor profile + library (saved in this browser) ---------- */
const PROF_KEY="arsx-profile";
const byKey=new Map(); // track key -> track object (filled when the library loads)
const rid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+Math.random().toString(36).slice(2,10)};
let profile=null;
try{profile=JSON.parse(localStorage.getItem(PROF_KEY))}catch(e){}
if(!profile||typeof profile!=="object"||!Array.isArray(profile.likes))profile={id:rid(),created:Date.now(),likes:[]};
const saveProfile=()=>{try{localStorage.setItem(PROF_KEY,JSON.stringify(profile))}catch(e){}};
saveProfile(); // a profile exists for every visitor from the first visit
const isLiked=t=>profile.likes.includes(t._k);
function syncLikes(){
    const set=new Set(profile.likes);
    document.querySelectorAll(".like[data-k]").forEach(b=>{
        const on=set.has(b.dataset.k);
        b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on));
    });
    const c=$("libCount");c.textContent=String(profile.likes.length);c.hidden=!profile.likes.length;
}
function toggleLike(t,btn){
    const i=profile.likes.indexOf(t._k);
    if(i>=0)profile.likes.splice(i,1);else profile.likes.unshift(t._k);
    saveProfile();syncLikes();
    if(btn){btn.classList.remove("pop");void btn.offsetWidth;btn.classList.add("pop")}
}
document.addEventListener("click",e=>{
    const b=e.target.closest(".like[data-k]");if(!b)return;
    e.stopPropagation();
    const t=byKey.get(b.dataset.k);if(t)toggleLike(t,b);
});
addEventListener("storage",e=>{ // another tab changed the profile
    if(e.key!==PROF_KEY||!e.newValue)return;
    try{const p=JSON.parse(e.newValue);if(p&&Array.isArray(p.likes)){profile=p;syncLikes()}}catch(err){}
});

/* ---------- play counts ---------- */
const COUNT_URL="https://arsx-8585-default-rtdb.europe-west1.firebasedatabase.app/plays"; // empty = this browser only
const plays={};
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,"")+"M":n>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,"")+"K":String(n);
const getPlays=t=>plays[t._k]||0;
const showPlays=t=>{const u=t._ui;if(u&&u.plays){const n=getPlays(t);u.plays.textContent=" · "+fmtN(n)+" plays"}};
(async()=>{
    try{
        if(COUNT_URL){const r=await fetch(COUNT_URL+".json",{cache:"no-cache"});if(r.ok)Object.assign(plays,(await r.json())||{})}
        else Object.assign(plays,JSON.parse(localStorage.getItem("arsx-plays")||"{}"));
    }catch(e){}
})();
function countPlay(t){
    plays[t._k]=getPlays(t)+1;showPlays(t);
    if(COUNT_URL){
        fetch(COUNT_URL+"/"+t._k+".json",{method:"PUT",keepalive:true,body:JSON.stringify({".sv":{"increment":1}})}).catch(()=>{});
    }else{try{localStorage.setItem("arsx-plays",JSON.stringify(plays))}catch(e){}}
}

const pic=(cls,p,alt)=>{
    const i=el("img",cls);i.alt=alt;i.loading="lazy";i.decoding="async";
    if(p)i.src=url(p);
    i.onerror=()=>{i.style.visibility="hidden"};
    return i;
};

/* ---------- player state ---------- */
const A=new Audio();A.preload="none";
let cur=null,queue=[],order=[],pos=0,shuf=false,rep=0,shown=null; // rep: 0 off, 1 all, 2 one
let audioCtx,analyser,dataArray,animating=false,lastT=0;

const miniPlayer=$("miniPlayer"),miniRange=$("miniRange"),miniCover=$("miniCover"),miniTitle=$("miniTitle"),miniArtist=$("miniArtist"),miniPlay=$("miniPlay");
const fullPlayer=$("fullPlayer"),fpBg=$("fpBg"),fpCover=$("fpCover"),fpTitle=$("fpTitle"),fpArtist=$("fpArtist"),fpRange=$("fpRange"),
      fpTimeCur=$("fpTimeCur"),fpTimeTot=$("fpTimeTot"),fpPlayIcon=$("fpPlayIcon"),fpDl=$("fpDl"),fpPulse=$("fpPulse"),
      fpRepeat=$("fpRepeat"),fpShuffle=$("fpShuffle"),fpLike=$("fpLike");
const SVG_PLAY='<path d="M8 5v14l11-7z"/>',SVG_PAUSE='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
let miniDrag=false;

function mkOrder(){
    const n=queue.length,idx=queue.indexOf(cur.t);
    order=[...Array(n).keys()];
    if(shuf){
        for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
        const k=order.indexOf(idx);[order[0],order[k]]=[order[k],order[0]];
    }
    pos=order.indexOf(idx);
}
function rowReset(t){
    const u=t&&t._ui;if(!u)return;
    u.play.textContent="▶";u.rng.value=0;fill(u.rng);u.rng.disabled=true;u.time.textContent="0:00";
}
function load(t){
    if(cur)rowReset(cur.t);
    cur={t,counted:false};
    if(t._ui)t._ui.rng.disabled=false;
    miniRange.value=0;fill(miniRange);fpRange.value=0;fill(fpRange);
    A.src=url(t.audio);A.play().catch(()=>{});
    updateUI();
}
function play(t,q){
    queue=q&&q.includes(t)?q:[t];
    load(t);mkOrder();
}
function step(d,auto){
    if(!cur)return false;
    let p=pos+d;
    if(p<0||p>=order.length){
        if(rep===1&&order.length)p=(p+order.length)%order.length;
        else if(d<0){A.currentTime=0;return true}
        else return false;
    }
    pos=p;load(queue[order[p]]);return true;
}
function stopPlayer(){
    A.pause();
    if(cur)rowReset(cur.t);
    A.removeAttribute("src");A.load();
    cur=null;shown=null;
    document.body.classList.remove("playing");
    updateUI();
}

function updateUI(){
    if(!cur){
        miniPlayer.classList.remove("show");
        fullPlayer.classList.remove("show");fullPlayer.setAttribute("aria-hidden","true");
        return;
    }
    const t=cur.t;
    if(shown!==t){
        shown=t;
        miniTitle.textContent=fpTitle.textContent=t.title||"-";
        miniArtist.textContent=fpArtist.textContent=t.artist||"";
        if(t.cover){
            const u=url(t.cover);
            miniCover.src=u;miniCover.style.visibility="visible";fpCover.src=u;
            fpBg.style.backgroundImage='url("'+u.replace(/"/g,"%22")+'")';
        }else{
            miniCover.removeAttribute("src");miniCover.style.visibility="hidden";
            fpCover.removeAttribute("src");fpBg.style.backgroundImage="none";
        }
        fpDl.href=url(t.audio);fpDl.download=(t.title||"track")+".mp3";
        fpLike.dataset.k=t._k;syncLikes();
    }
    const p=A.paused;
    miniPlay.textContent=p?"▶":"❚❚";
    fpPlayIcon.innerHTML=p?SVG_PLAY:SVG_PAUSE;
    miniPlayer.classList.add("show");
}

/* bass pulse (desktop only, only while full player is open) */
function initAudio(){
    if(audioCtx||matchMedia("(pointer:coarse)").matches)return;
    try{
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        audioCtx=new AC();analyser=audioCtx.createAnalyser();analyser.fftSize=64;analyser.smoothingTimeConstant=.8;
        dataArray=new Uint8Array(analyser.frequencyBinCount);
        audioCtx.createMediaElementSource(A).connect(analyser);analyser.connect(audioCtx.destination);
    }catch(e){}
}
function pulse(t){
    if(!analyser||A.paused||!fullPlayer.classList.contains("show")){animating=false;fpPulse.style.opacity=0;fpCover.style.transform="";return}
    requestAnimationFrame(pulse);
    if(t-lastT<33)return;lastT=t;
    analyser.getByteFrequencyData(dataArray);
    let s=0;for(let i=0;i<6;i++)s+=dataArray[i];
    const l=s/1530;
    fpPulse.style.opacity=(l*.9).toFixed(2);
    fpCover.style.transform="scale("+(1+l*.04).toFixed(3)+")";
}
function startViz(){
    if(!fullPlayer.classList.contains("show")||A.paused)return;
    initAudio();
    if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
    if(!analyser||animating)return;
    animating=true;requestAnimationFrame(pulse);
}

A.addEventListener("play",()=>{
    document.body.classList.add("playing");
    if(cur&&cur.t._ui)cur.t._ui.play.textContent="❚❚";
    startViz();updateUI();
});
A.addEventListener("pause",()=>{
    if(!cur)return;
    document.body.classList.remove("playing");
    if(!A.ended&&cur.t._ui)cur.t._ui.play.textContent="▶";
    updateUI();
});
A.addEventListener("ended",()=>{
    if(!cur)return;
    if(rep===2){cur.counted=false;A.currentTime=0;A.play();return}
    if(!step(1,true)){rowReset(cur.t);miniRange.value=0;fill(miniRange);fpRange.value=0;fill(fpRange);updateUI()}
});
A.addEventListener("error",()=>{if(cur){rowReset(cur.t);updateUI()}});
A.addEventListener("timeupdate",()=>{
    if(!cur||!isFinite(A.duration)||!A.duration)return;
    if(!cur.counted&&A.currentTime>=5){cur.counted=true;countPlay(cur.t)}
    const v=A.currentTime/A.duration*1000,u=cur.t._ui;
    if(u){u.rng.value=v;fill(u.rng);u.time.textContent=fmt(A.currentTime)+" / "+fmt(A.duration)}
    if(!miniDrag){miniRange.value=v;fill(miniRange)}
    if(fullPlayer.classList.contains("show")){
        fpRange.value=v;fill(fpRange);
        fpTimeCur.textContent=fmt(A.currentTime);fpTimeTot.textContent=fmt(A.duration);
    }
});

const seekTo=v=>{if(cur&&A.duration)A.currentTime=v/1000*A.duration};

/* ---------- mini player events ---------- */
miniRange.addEventListener("pointerdown",()=>{miniDrag=true});
["pointerup","pointercancel","change"].forEach(ev=>miniRange.addEventListener(ev,()=>{miniDrag=false}));
miniRange.addEventListener("click",e=>e.stopPropagation());
miniRange.addEventListener("input",()=>{fill(miniRange);seekTo(miniRange.value)});
$("miniClose").addEventListener("click",e=>{e.stopPropagation();stopPlayer()});
miniPlay.addEventListener("click",e=>{e.stopPropagation();if(cur)A.paused?A.play():A.pause()});
$("miniNext").addEventListener("click",e=>{e.stopPropagation();step(1)});
miniPlayer.addEventListener("click",()=>{
    if(!cur)return;
    fullPlayer.classList.add("show");fullPlayer.setAttribute("aria-hidden","false");
    const v=A.duration?A.currentTime/A.duration*1000:0;
    fpRange.value=v;fill(fpRange);fpTimeCur.textContent=fmt(A.currentTime);fpTimeTot.textContent=fmt(A.duration);
    startViz();
});

/* ---------- full player events ---------- */
$("fpClose").addEventListener("click",()=>{fullPlayer.classList.remove("show");fullPlayer.setAttribute("aria-hidden","true")});
$("fpPlay").addEventListener("click",()=>{if(cur)A.paused?A.play():A.pause()});
$("fpNext").addEventListener("click",()=>step(1));
$("fpPrev").addEventListener("click",()=>{if(!cur)return;if(A.currentTime>3)A.currentTime=0;else step(-1)});
fpRange.addEventListener("input",()=>{fill(fpRange);seekTo(fpRange.value)});
fpShuffle.addEventListener("click",()=>{
    shuf=!shuf;fpShuffle.classList.toggle("on",shuf);fpShuffle.setAttribute("aria-pressed",String(shuf));
    if(cur)mkOrder();
});
fpRepeat.addEventListener("click",()=>{
    rep=(rep+1)%3;
    fpRepeat.dataset.m=rep;fpRepeat.classList.toggle("on",rep>0);fpRepeat.setAttribute("aria-pressed",String(rep>0));
});

/* ---------- track rows ---------- */
const HEART='<svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.3l7.8-7.8 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
function createTrack(t,q){
    const row=el("div","track"),info=el("div","track-info"),bar=el("div","bar");
    const rng=el("input");rng.type="range";rng.min=0;rng.max=1000;rng.value=0;rng.disabled=true;rng.setAttribute("aria-label","Seek "+t.title);
    const time=el("span","time","0:00");
    bar.append(rng,time);
    const ap=el("p","",t.artist||""),pl=el("span","plays");ap.appendChild(pl);
    info.append(el("h4","",t.title),ap,bar);

    const mk=(cls,txt,label)=>{const b=el("button",cls,txt);b.type="button";b.setAttribute("aria-label",label);return b};

/* ---------- fuzzy search (strings are normalised once, not per keystroke) ---------- */
const norm=s=>String(s||"").normalize("NFKD")
    .replace(/[\u0300-\u036f\u064b-\u065f\u0670\u200c\u200d]/g,"")
    .toLowerCase()
    .replace(/[\u064a\u0649]/g,"\u06cc").replace(/\u0643/g,"\u06a9")
    .replace(/[\u0629\u06c0]/g,"\u0647")
    .replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-1632).replace(/[\u06f0-\u06f9]/g,d=>d.charCodeAt(0)-1776)
    .replace(/[^a-z0-9\u0600-\u06ff]+/g," ").trim();
function lev(a,b){
    const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});
    for(let j=1;j<=n;j++)d[0][j]=j;
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
        d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
        if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
    }
    return d[m][n];
}
function tokScore(q,t){
    if(t===q)return 1;
    if(t.startsWith(q))return .95;
    if(q.length>=3&&t.includes(q))return .85;
    const lim=q.length<=3?0:q.length<=5?1:q.length<=8?2:3;
    if(!lim)return 0;
    const d=Math.min(lev(q,t),q.length>=4?lev(q,t.slice(0,q.length)):9);
    return d<=lim?.8-d*.1:0;
}
function score(q,t){ // t is already normalised
    if(!t)return 0;
    const qt=q.split(" "),tt=t.split(" ");let sum=0;
    for(const x of qt){let b=0;for(const y of tt)b=Math.max(b,tokScore(x,y));if(!b){sum=0;break}sum+=b}
    let s=sum/qt.length;
    const qc=q.replace(/ /g,""),tc=t.replace(/ /g,"");
    if(qc.length>=3){
        if(tc.includes(qc))s=Math.max(s,.9);
        else if(qc.length>=4){const lim=qc.length<=5?1:qc.length<=8?2:3;if(Math.min(lev(qc,tc),lev(qc,tc.slice(0,qc.length)))<=lim)s=Math.max(s,.7)}
    }
    return s;
}

/* ---------- data ---------- */
async function load_(f){
    try{const r=await fetch("./assets/"+f,{cache:"no-cache"});return r.ok?((await r.json()).artists||[]):[]}
    catch{return[]}
}
function merge(lists){
    const map=new Map();
    lists.flat().forEach(a=>{
        const k=a.name.trim().toLowerCase();
        if(!map.has(k))map.set(k,{name:a.name,photo:a.photo,description:a.description,aliases:[],singles:[],albums:[]});
        const m=map.get(k);
        m.photo=m.photo||a.photo;m.description=m.description||a.description;
        m.aliases=[...new Set([...m.aliases,...(a.aliases||[])])];
        m.singles.push(...(a.singles||[]));m.albums.push(...(a.albums||[]));

}
function prep(a){
    const one=(t,b)=>{t.artist=t.artist||a.name;t.cover=t.cover||(b&&b.cover)||null;t._n=norm(t.title);t._an=norm(t.artist);t._k=hash(String(t.audio));if(!byKey.has(t._k))byKey.set(t._k,t)};
    a.singles.forEach(t=>one(t,null));
    a.albums.forEach(b=>{b.tracks=b.tracks||[];b._n=norm(b.title);b.tracks.forEach(t=>one(t,b))});
    a._names=[a.name,...(a.aliases||[])].map(norm);
    a._tracks=[...a.singles,...a.albums.flatMap(b=>b.tracks)];
}

(async()=>{
    const FIRST=5,list=$("artistList"),searchEl=$("search"),clearBtn=$("searchClear");
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const artists=shuffle(merge(await Promise.all([load_("library.json"),load_("library.auto.json")])));
    if(!artists.length){list.appendChild(el("div","empty",location.protocol==="file:"?"OPENED AS A LOCAL FILE - the browser blocks loading assets/library.json. Open the site through GitHub Pages or a local server.":"LIBRARY NOT FOUND - check assets/library.json"));return}

    artists.forEach(prep);
    // drop liked songs whose files no longer exist in the archive
    if(byKey.size){const n=profile.likes.length;profile.likes=profile.likes.filter(k=>byKey.has(k));if(profile.likes.length!==n)saveProfile()}
    syncLikes();
    const items=artists.map(a=>{try{return renderArtist(a,list)}catch(err){console.error("Bad artist entry:",a&&a.name,err);return null}}).filter(Boolean);
    const noRes=el("div","empty","");noRes.style.display="none";
    const moreBtn=el("button","view-more more-artists","MORE ARTISTS");moreBtn.type="button";
    list.after(noRes);noRes.after(moreBtn);
    let showingAll=false;

    function showDefault(){
        noRes.style.display="none";
        items.forEach((it,i)=>{it.group.style.display=(i<FIRST||showingAll)?"":"none"});
        moreBtn.style.display=(!showingAll&&items.length>FIRST)?"":"none";
    }
    moreBtn.addEventListener("click",()=>{
        showingAll=true;
        items.forEach((it,i)=>{
            if(i<FIRST)return;
            it.group.style.display="";
            it.group.style.animationDelay=((i-FIRST)*0.07)+"s";
            it.group.classList.remove("fade-in");void it.group.offsetWidth;
            it.group.classList.add("fade-in");
        });
        moreBtn.style.display="none";
    });
    showDefault();

    const topBox=el("div","top-results");topBox.style.display="none";list.before(topBox);
    function showTop(r){
        topBox.replaceChildren();
        if(!r.length){topBox.style.display="none";return}
        const q=r.map(x=>x.t),f=document.createDocumentFragment();
        f.appendChild(el("div","top-label",r.length>1?"SONGS":"SONG"));
        q.forEach(t=>f.appendChild(createTrack(t,q)));
        topBox.appendChild(f);topBox.style.display="";
    }

    function run(raw){
        try{
            items.forEach(it=>{it.group.classList.remove("fade-in");it.group.style.animationDelay=""});
            const q=norm(raw);
            if(q.length<2){
                list.append(...items.map(i=>i.group));
                showDefault();showTop([]);
                return;
            }
            items.forEach(it=>{
                const a=it.artist;
                it.sName=Math.max(...a._names.map(n=>score(q,n)));
                let best=it.sName;
                a.albums.forEach(b=>{best=Math.max(best,score(q,b._n)*.95)});
                a._tracks.forEach(t=>{
                    t._ts=score(q,t._n);
                    best=Math.max(best,t._ts,.85*score(q,t._an));
                });
                it.score=best;
            });
            const bestName=Math.max(0,...items.map(i=>i.sName));
            const all=items.flatMap(it=>it.artist._tracks.map(t=>({it,t})))
                .sort((a,b)=>b.t._ts-a.t._ts||String(a.t.title).length-String(b.t.title).length);
            const best=all.length?all[0].t._ts:0;
            const showSongs=best>=.6&&best>=bestName-.15;
            showTop(showSongs?all.filter(r=>r.t._ts>=Math.max(.6,best-.15)).slice(0,8):[]);

            const hits=items.filter(i=>i.score>=.6).sort((a,b)=>b.score-a.score);
            const rest=items.filter(i=>i.score<.6);
            hits.forEach(i=>i.group.style.display="");
            rest.forEach(i=>i.group.style.display="none");
            list.append(...hits.map(i=>i.group),...rest.map(i=>i.group));
            const nothing=!hits.length&&!showSongs;
            noRes.textContent=nothing?"NOTHING FOUND - TRY FEWER LETTERS":"";
            noRes.style.display=nothing?"":"none";
            moreBtn.style.display="none";
        }catch(err){console.error("Search error",err)}
    }

    let timer;
    searchEl.addEventListener("input",e=>{
        clearBtn.hidden=!e.target.value;
        clearTimeout(timer);
        timer=setTimeout(()=>run(e.target.value),180);
    });
    clearBtn.addEventListener("click",()=>{
        clearTimeout(timer);
        searchEl.value="";clearBtn.hidden=true;run("");searchEl.focus();
    });
    if(searchEl.value){clearBtn.hidden=false;run(searchEl.value)}
})();

    const listen=()=>{
        if(on)return;on=true;
        addEventListener("deviceorientation",onOri,{passive:true});
        addEventListener("devicemotion",onMot,{passive:true});
        setTimeout(generic,2000);
    };
    if(matchMedia("(pointer:fine)").matches){
        addEventListener("pointermove",e=>{act();tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;kick()},{passive:true});
    }
    if(typeof DeviceOrientationEvent==="undefined")return;
    if(typeof DeviceOrientationEvent.requestPermission==="function"){
        const ask=()=>{
            if(on||denied)return;
            const reqs=[DeviceOrientationEvent.requestPermission()];
            if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function")reqs.push(DeviceMotionEvent.requestPermission());
            Promise.all(reqs).then(r=>{if(r[0]==="granted")listen();else denied=true}).catch(()=>{});
        };
        addEventListener("click",ask);
    }else{listen()}
})();
</script>
</body>
