<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSX — Music Archive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;padding:35px 7%;padding-bottom:120px;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:100px}
.date{font-size:11px;letter-spacing:2px;color:#555;font-weight:600}
.logo{font-size:35px;font-weight:900;letter-spacing:7px;animation:logoMove 7s ease-in-out infinite alternate}
@property --amp{syntax:"<length>";inherits:true;initial-value:3px}
.logo{display:inline-flex;--amp:3px;transition:--amp 1.4s ease}
body.playing .logo{--amp:9px}
.logo .l{display:inline-block;animation:wave 3.2s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i)*-.4s)}
@keyframes wave{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(calc(var(--amp)*-1));opacity:1}}
@keyframes logoMove{from{letter-spacing:7px}to{letter-spacing:11px}}
main{max-width:900px;margin:auto}
.section-title{font-size:12px;letter-spacing:5px;margin-bottom:35px}
.artist-card{display:flex;align-items:center;gap:25px;padding:22px 0}
.artist-photo{width:125px;height:125px;object-fit:cover;background:#eee;flex-shrink:0;border-radius:16px}
.artist-info{flex:1;min-width:0}
.artist-info h3{font-size:19px;margin-bottom:9px}
.artist-info p{font-size:10px;color:#888;letter-spacing:2px;margin-bottom:18px}
.view-more{background:transparent;color:#111;border:1px solid #111;padding:11px 23px;font-size:9px;letter-spacing:3px;cursor:pointer;transition:.3s;border-radius:12px}
.view-more:hover,.view-more:focus-visible{background:#111;color:#fff}

/* smooth open/close */
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1)}
.collapse.open{grid-template-rows:1fr}
.collapse>.inner{overflow:hidden;min-height:0}
.artist-content .inner{padding:0}

.artist-content .pad{padding:10px 0 35px}

.album-heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:30px 0 10px;padding-top:20px;border-top:1px solid #eee}
.album-heading h3{font-size:15px;letter-spacing:3px;margin-bottom:7px}
.album-heading p{font-size:10px;color:#888;letter-spacing:2px}
.album-heading .view-more{flex-shrink:0}

.track{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #f0f0f0}
.cover{width:85px;height:85px;object-fit:cover;background:#eee;flex-shrink:0;border-radius:12px}
.ctrl{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ctrl button, .ctrl a.dl-btn{border:1px solid #111;background:#fff;color:#111;cursor:pointer;font-size:10px;width:32px;height:32px;border-radius:50%;transition:.2s;display:flex;align-items:center;justify-content:center;text-decoration:none;}
.ctrl button.play{width:42px;height:42px;font-size:14px}
.ctrl button:hover,.ctrl button:focus-visible,.ctrl a.dl-btn:hover{background:#111;color:#fff}
.track-info{flex:1;min-width:0}
.track-info h4{font-size:14px;margin-bottom:7px}
.track-info p{font-size:10px;color:#888;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:12px}
.time{font-size:10px;color:#888;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;outline:none;cursor:pointer;--p:0%;background:linear-gradient(to right,#111 var(--p),#ddd var(--p))}
input[type=range]:disabled{cursor:default;opacity:.6}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#111;border:0}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#111;border:0}
#search{width:100%;border:1px solid #e8e8e8;border-radius:12px;padding:13px 18px;margin-bottom:10px;font-size:12px;letter-spacing:2px;font-family:inherit;color:#111;outline:none;transition:border-color .3s}
#search:focus{border-color:#111}
.track.hit{background:#f7f7f7;box-shadow:0 0 0 10px #f7f7f7;border-radius:12px;border-bottom-color:transparent}
.empty{font-size:12px;color:#999;letter-spacing:1px;padding:20px 0}

@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.artist-group.fade-in { animation: fadeIn .5s ease-out both; }

.tg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,200%);opacity:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.tg.show{transform:translate(calc(-50% + var(--dx,0px)),0);opacity:1}
.tg.drag{transition:none}
.tg-link{display:flex;align-items:center;gap:12px;background:#fff;color:#111;text-decoration:none;border:1px solid #e8e8e8;border-radius:16px;padding:10px 20px 10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.08);white-space:nowrap;-webkit-user-drag:none}
.tg-ico{width:34px;height:34px;flex-shrink:0}
.tg-text b{display:block;font-size:11px;letter-spacing:3px}
.tg-text small{display:block;font-size:10px;color:#888;letter-spacing:1px;margin-top:4px}
.about{border-top:1px solid #e8e8e8;margin-top:100px;padding-top:40px;margin-bottom:80px}
.about p{font-size:13px;line-height:2;color:#777;max-width:550px}
footer{text-align:center;border-top:1px solid #eee;padding-top:30px;font-size:10px;color:#999;letter-spacing:2px}
footer a{color:#111;text-decoration:none}

/* ===== MINI PLAYER ===== */
.mini-player{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:#fff;
    border-radius: 28px 28px 0 0;
    border-top: 1px solid rgba(0,0,0,0.04);
    transform:translateY(110%);opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-shadow:0 -10px 40px rgba(0,0,0,.06);
    cursor:pointer;
}
.mini-player.show{transform:translateY(0);opacity:1}
.mini-progress{height:3px;width:100%;position:relative;overflow:hidden;background:#f0f0f0;border-radius: 28px 28px 0 0;}
.mini-progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#111;transition:width .15s linear}
.mini-wave{position:absolute;left:0;right:0;top:-6px;height:14px;pointer-events:none;opacity:0;transition:opacity .4s}
.mini-player.show .mini-wave{opacity:1}
.mini-wave svg{width:200%;height:100%;display:block}
.mini-wave path{fill:none;stroke:#111;stroke-width:1.4;stroke-linecap:round;opacity:.35;animation:waveFlow 4.5s ease-in-out infinite}
.mini-wave path:nth-child(2){opacity:.22;animation-duration:5.8s;animation-delay:-1.2s}
.mini-wave path:nth-child(3){opacity:.15;animation-duration:7s;animation-delay:-2.4s}
@keyframes waveFlow{0%{transform:translateX(0)}50%{transform:translateX(-25%)}100%{transform:translateX(-50%)}}
.mini-inner{display:flex;align-items:center;gap:14px;padding:12px 18px 14px;max-width:900px;margin:0 auto;}
.mini-cover{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0;}
.mini-info{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-artist{font-size:10px;color:#888;letter-spacing:1px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mini-ctrl button{border:1px solid #111;background:#fff;color:#111;cursor:pointer;width:36px;height:36px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.2s}
.mini-ctrl #miniNext {background: #111; color: #fff; border: none;}
.mini-ctrl #miniNext:hover {background: #333; transform: scale(1.05);}
.mini-ctrl button:hover,.mini-ctrl button:focus-visible{background:#111;color:#fff}
.mini-ctrl .mini-play{width:42px;height:42px;font-size:14px}

/* ===== FULL SCREEN PLAYER ===== */
.full-player {
    position: fixed; inset: 0; z-index: 100;
    background: #111; color: #fff;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transform: translateY(100%);
    transition: opacity .4s, transform .4s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden;
    --bass: 0;
}
.full-player.show { opacity: 1; pointer-events: auto; transform: translateY(0); }

.fp-bg {
    position: absolute; inset: -50px;
    background-size: cover; background-position: center;
    filter: blur(calc(40px - (var(--bass) * 25px))) brightness(calc(0.4 - (var(--bass) * 0.15)));
    transform: scale(calc(1 + (var(--bass) * 0.06)));
    transition: filter 0.08s ease-out, transform 0.08s ease-out;
    z-index: 1;
}
.fp-bg::after {
    content: ''; position: absolute; inset: 0;
    background: #000;
    opacity: calc(0.2 + (var(--bass) * 0.3)); 
    transition: opacity 0.08s ease-out;
}

.fp-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    height: 100%; padding: 40px 20px calc(30px + env(safe-area-inset-bottom,0px));
    max-width: 600px; margin: 0 auto; width: 100%;
}
.fp-header { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.fp-close, .fp-dl {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 44px; height: 44px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; text-decoration: none;
}
.fp-close:hover, .fp-dl:hover { background: rgba(255,255,255,0.2); }

.fp-main { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 20px;}
.fp-cover {
    width: 75vw; max-width: 320px; aspect-ratio: 1;
    border-radius: 20px; object-fit: cover;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    background: #222;
}
.fp-info { text-align: center; margin-top: 40px; width: 100%; }
.fp-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fp-artist { font-size: 14px; color: #aaa; letter-spacing: 1px; }

.fp-bottom { width: 100%; }
.fp-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
.fp-times { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; font-variant-numeric: tabular-nums;}
.fp-bar input[type=range] { height: 4px; background:linear-gradient(to right,#fff var(--p),rgba(255,255,255,0.2) var(--p)); }
.fp-bar input[type=range]::-webkit-slider-thumb { background: #fff; width: 12px; height: 12px; }
.fp-bar input[type=range]::-moz-range-thumb { background: #fff; width: 12px; height: 12px; }

.fp-ctrl { display: flex; align-items: center; justify-content: center; gap: 30px; }
.fp-ctrl button {
    background: transparent; border: none; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
}
.fp-ctrl button:hover { opacity: 0.7; transform: scale(1.1); }
.fp-ctrl .fp-play {
    background: #fff; color: #111; width: 70px; height: 70px;
    border-radius: 50%; font-size: 24px;
    box-shadow: 0 4px 15px rgba(255,255,255,0.2);
}
.fp-ctrl .fp-play:hover { opacity: 1; transform: scale(1.05); }
.fp-ctrl svg { fill: currentColor; }

@media(max-width:600px){
    body{padding:25px 6%;padding-bottom:110px}
    header{margin-bottom:70px}
    .logo{font-size:27px}
    .artist-card{gap:15px}
    .artist-photo{width:95px;height:95px}
    .artist-info h3{font-size:15px}
    .track{flex-wrap:wrap;gap:12px}
    .cover{width:72px;height:72px}
    .track-info{flex:1 1 calc(100% - 90px)}
    .ctrl{order:3;width:100%;justify-content:center;gap:10px;}
    .time{min-width:70px}
    .mini-inner{padding:10px 14px 12px;gap:10px}
    .mini-cover{width:38px;height:38px}
    .mini-ctrl button{width:32px;height:32px}
    .mini-ctrl .mini-play{width:38px;height:38px}
}

/* ===== GLASS ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 10% 15%,rgba(255,140,170,.38),transparent 42%),
    radial-gradient(circle at 90% 28%,rgba(120,170,255,.38),transparent 44%),
    radial-gradient(circle at 25% 88%,rgba(140,230,200,.32),transparent 46%),
    radial-gradient(circle at 88% 92%,rgba(255,205,120,.30),transparent 42%),#fff}
.artist-group{
  background:rgba(255,255,255,.38);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.65);border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8);
  margin-bottom:16px;padding:0 22px}
.artist-content.open{border-bottom:0}
.artist-group .track{border-bottom-color:rgba(0,0,0,.07)}
.artist-group .album-heading{border-top-color:rgba(0,0,0,.07)}
.artist-photo{background:rgba(255,255,255,.5)}
.artist-group .view-more{background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.artist-group .view-more:hover,.artist-group .view-more:focus-visible{background:#111}
#search{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-bottom:22px}
.view-more.more-artists{display:block;width:100%;padding:16px;margin-top:24px;font-size:11px;
  background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px}
.view-more.more-artists:hover{background:#111}
</style>
</head>

<script>
/* today's date, top-left; refreshes itself at midnight */
function setDate(){
    document.getElementById("date").textContent =
        new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).toUpperCase();
    const n=new Date();
    setTimeout(setDate,new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,1)-n);
}
setDate();

/* ---------- helpers ---------- */
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const url=p=>"./assets/"+p.split("/").map(encodeURIComponent).join("/");
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";
const pic=(cls,p,alt)=>{
    const i=el("img",cls);i.alt=alt;i.loading="lazy";
    if(p)i.src=url(p);
    i.onerror=()=>{i.style.visibility="hidden"};
    return i;
};
const fill=r=>r.style.setProperty("--p",(r.value/10)+"%");

function collapse(content){
    const wrap=el("div","collapse"),inner=el("div","inner");
    inner.appendChild(content);wrap.appendChild(inner);return wrap;
}
function bindToggle(btn,wrap,onChange){
    const set=o=>{wrap.classList.toggle("open",o);btn.setAttribute("aria-expanded",String(o));onChange&&onChange(o)};
    btn.setAttribute("aria-expanded","false");
    btn.addEventListener("click",()=>set(!wrap.classList.contains("open")));
    return set;
}

/* ---------- Player Logic & Audio Analyzer ---------- */
const A=new Audio();A.preload="none";
let cur=null;

let audioCtx, analyser, source, dataArray;
let isAnimating = false;

// Mini Player Elements
const miniPlayer=document.getElementById("miniPlayer");
const miniFill=document.getElementById("miniFill");
const miniCover=document.getElementById("miniCover");
const miniTitle=document.getElementById("miniTitle");
const miniArtist=document.getElementById("miniArtist");
const miniPlay=document.getElementById("miniPlay");
const miniNext=document.getElementById("miniNext");

// Full Player Elements
const fullPlayer = document.getElementById("fullPlayer");
const fpBg = document.getElementById("fpBg");
const fpCover = document.getElementById("fpCover");
const fpTitle = document.getElementById("fpTitle");
const fpArtist = document.getElementById("fpArtist");
const fpRange = document.getElementById("fpRange");
const fpTimeCur = document.getElementById("fpTimeCur");
const fpTimeTot = document.getElementById("fpTimeTot");
const fpPlay = document.getElementById("fpPlay");
const fpPlayIcon = document.getElementById("fpPlayIcon");
const fpPrev = document.getElementById("fpPrev");
const fpNext = document.getElementById("fpNext");
const fpClose = document.getElementById("fpClose");
const fpDl = document.getElementById("fpDl");

const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
const SVG_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

function initAudioEngine() {
    if (audioCtx) return;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.8;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        source = audioCtx.createMediaElementSource(A);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
    } catch (e) {
        console.warn("AudioContext blocked", e);
    }
}

function animateBass() {
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    let bassSum = 0;
    const bins = 6;
    for (let i = 0; i < bins; i++) {
        bassSum += dataArray[i];
    }
    const level = (bassSum / bins) / 255;
    fullPlayer.style.setProperty('--bass', level.toFixed(3));
    
    if (!A.paused) {
        requestAnimationFrame(animateBass);
    } else {
        fullPlayer.style.setProperty('--bass', 0);
        isAnimating = false;
    }
}

function updateUI(){
    if(!cur){
        miniPlayer.classList.remove("show");
        fullPlayer.classList.remove("show");
        return;
    }
    
    miniTitle.textContent=cur.title||"-";
    miniArtist.textContent=cur.artist||"";
    fpTitle.textContent=cur.title||"-";
    fpArtist.textContent=cur.artist||"";

    if(cur.cover){
        const u = url(cur.cover);
        miniCover.src=u; miniCover.style.visibility="visible";
        fpCover.src=u;
        fpBg.style.backgroundImage = `url('${u}')`;
    }else{
        miniCover.removeAttribute("src"); miniCover.style.visibility="hidden";
        fpCover.removeAttribute("src");
        fpBg.style.backgroundImage = "none";
    }

    fpDl.href = url(cur.audio);
    fpDl.download = (cur.title || "track") + ".mp3";

    const isPaused = A.paused;
    miniPlay.textContent = isPaused ? "▶" : "❚❚";
    fpPlayIcon.innerHTML = isPaused ? SVG_PLAY : SVG_PAUSE;
    
    miniPlayer.classList.add("show");
}

A.addEventListener("play",()=>{
    document.body.classList.add("playing");
    initAudioEngine();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!isAnimating) { isAnimating = true; requestAnimationFrame(animateBass); }
    updateUI();
});

["pause","ended","error"].forEach(e=>A.addEventListener(e,()=>{
    document.body.classList.remove("playing");
    if(e==="pause"||e==="error") updateUI();
}));
A.addEventListener("play",()=>cur&&(cur.btn.textContent="❚❚"));
A.addEventListener("pause",()=>cur&&!A.ended&&(cur.btn.textContent="▶"));
A.addEventListener("ended",()=>{
    if(!cur)return;
    const n=cur.row.nextRow;
    cur.reset();
    if(n) n.start();
    else setTimeout(()=>{if(!cur||A.paused) miniPlayer.classList.remove("show")},400);
});
A.addEventListener("error",()=>cur&&cur.reset());

A.addEventListener("timeupdate",()=>{
    if(!cur||!A.duration)return;
    const p = (A.currentTime/A.duration)*100;
    const val = A.currentTime/A.duration*1000;
    
    cur.rng.value = val; fill(cur.rng);
    cur.time.textContent = fmt(A.currentTime)+" / "+fmt(A.duration);
    miniFill.style.width = p+"%";
    
    fpRange.value = val; fill(fpRange);
    fpTimeCur.textContent = fmt(A.currentTime);
    fpTimeTot.textContent = fmt(A.duration);
});

const chain=r=>r.forEach((x,i)=>{ x.nextRow=r[i+1]; x.prevRow=r[i-1]; });
function createTrack(t){
    const row=el("div","track");
    const info=el("div","track-info");
    const bar=el("div","bar");
    const rng=el("input");rng.type="range";rng.min=0;rng.max=1000;rng.value=0;rng.disabled=true;rng.setAttribute("aria-label","Seek "+t.title);
    const time=el("span","time","0:00");
    bar.append(rng,time);
    info.append(el("h4","",t.title),el("p","",t.artist||""),bar);

    const mk=(cls,txt,label)=>{const b=el("button",cls,txt);b.type="button";b.setAttribute("aria-label",label);return b};
    const back=mk("","−10","Back 10 seconds"),play=mk("play","▶","Play "+t.title),fwd=mk("","+10","Forward 10 seconds");
    
    const dl = el("a", "dl-btn");
    dl.href = url(t.audio);
    dl.setAttribute("download", (t.title || "track") + ".mp3");
    dl.setAttribute("aria-label", "Download " + t.title);
    dl.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
    
    const ctrl=el("div","ctrl");
    ctrl.append(back,play,fwd,dl);

    const reset=()=>{play.textContent="▶";rng.value=0;fill(rng);rng.disabled=true;time.textContent="0:00"};
    const mine=()=>cur&&cur.row===row;

    const start=()=>{
        if(cur)cur.reset();
        cur={row,btn:play,rng,time,reset,title:t.title,artist:t.artist||"",cover:t.cover||null,audio:t.audio};
        rng.disabled=false;
        A.src=url(t.audio);A.play().catch(()=>reset());
        updateUI();
    };
    row.start=start;
    play.addEventListener("click",()=>{if(mine()){A.paused?A.play():A.pause();return}start()});
    const skip=d=>()=>{if(mine()&&A.duration)A.currentTime=Math.max(0,Math.min(A.duration,A.currentTime+d))};
    back.addEventListener("click",skip(-10));fwd.addEventListener("click",skip(10));
    rng.addEventListener("input",()=>{fill(rng);if(mine()&&A.duration)A.currentTime=rng.value/1000*A.duration});

    row.append(pic("cover",t.cover,t.title),ctrl,info);
    return row;
}

function createAlbum(album){
    const box=el("div");
    const head=el("div","album-heading");
    const txt=el("div");txt.append(el("h3","",album.title),el("p","","FULL ALBUM"));
    const btn=el("button","view-more","VIEW MORE");btn.type="button";
    head.append(txt,btn);
    const list=el("div");
    const rows=album.tracks.map(t=>createTrack({...t,cover:album.cover,artist:t.artist||""}));chain(rows);rows.forEach(r=>list.appendChild(r));
    const wrap=collapse(list);
    const set=bindToggle(btn,wrap,o=>{btn.textContent=o?"VIEW LESS":"VIEW MORE"});
    box.append(head,wrap);box.api={set,wrap,rows,title:album.title};return box;
}

/* ---------- fuzzy search ---------- */
const norm=s=>String(s||"").normalize("NFKD")
    .replace(/[\u0300-\u036f\u064b-\u065f\u0670\u200c\u200d]/g,"")
    .toLowerCase()
    .replace(/[\u064a\u0649]/g,"\u06cc").replace(/\u0643/g,"\u06a9")
    .replace(/[\u0629\u06c0]/g,"\u0647")
    .replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-1632).replace(/[\u06f0-\u06f9]/g,d=>d.charCodeAt(0)-1776)
    .replace(/[^a-z0-9\u0600-\u06ff]+/g," ").trim();
function lev(a,b){
    const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>{const r=new Array(n+1).fill(0);r[0]=i;return r});
    for(let j=1;j<=n;j++)d[0][j]=j;
    for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
        d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
        if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
    }
    return d[m][n];
}
function tokScore(q,t){
    if(t===q)return 1;
    if(t.startsWith(q))return .95;
    if(q.length>=3&&t.includes(q))return .85;
    const lim=q.length<=3?0:q.length<=5?1:q.length<=8?2:3;
    if(!lim)return 0;
    const d=Math.min(lev(q,t),q.length>=4?lev(q,t.slice(0,q.length)):9);
    return d<=lim?.8-d*.1:0;
}
function score(q,text){
    const t=norm(text);if(!t)return 0;
    const qt=q.split(" "),tt=t.split(" ");let sum=0;
    for(const x of qt){let b=0;for(const y of tt)b=Math.max(b,tokScore(x,y));if(!b){sum=0;break}sum+=b}
    let s=sum/qt.length;
    const qc=q.replace(/ /g,""),tc=t.replace(/ /g,"");
    if(qc.length>=3){
        if(tc.includes(qc))s=Math.max(s,.9);
        else if(qc.length>=4){const lim=qc.length<=5?1:qc.length<=8?2:3;if(Math.min(lev(qc,tc),lev(qc,tc.slice(0,qc.length)))<=lim)s=Math.max(s,.7)}
    }
    return s;
}

/* ---------- data ---------- */
async function load(f){
    try{const r=await fetch("./assets/"+f,{cache:"no-cache"});return r.ok?((await r.json()).artists||[]):[]}
    catch{return[]}
}
function merge(lists){
    const map=new Map();
    lists.flat().forEach(a=>{
        const k=a.name.trim().toLowerCase();
        if(!map.has(k))map.set(k,{name:a.name,photo:a.photo,description:a.description,aliases:[],singles:[],albums:[]});
        const m=map.get(k);
        m.photo=m.photo||a.photo;m.description=m.description||a.description;
        m.aliases=[...new Set([...m.aliases,...(a.aliases||[])])];
        m.singles.push(...(a.singles||[]));m.albums.push(...(a.albums||[]));
    });
    return [...map.values()];
}

function renderArtist(artist,list){
    const group=el("div","artist-group");
    const card=el("div","artist-card");
    const info=el("div","artist-info");
    const btn=el("button","view-more","VIEW MORE");btn.type="button";
    info.append(el("h3","",artist.name),el("p","",artist.description||"ARTIST"),btn);
    card.append(pic("artist-photo",artist.photo,artist.name),info);

    const pad=el("div","pad");
    if(!artist.singles.length&&!artist.albums.length)pad.appendChild(el("div","empty","NO TRACKS YET"));
    const sr=artist.singles.map(t=>createTrack(t));chain(sr);sr.forEach(r=>pad.appendChild(r));
    const boxes=artist.albums.map(a=>createAlbum(a));boxes.forEach(b=>pad.appendChild(b));
    const wrap=collapse(pad);wrap.classList.add("artist-content");
    const set=bindToggle(btn,wrap,o=>{btn.textContent=o?"VIEW LESS":"VIEW MORE"});
    group.append(card,wrap);list.appendChild(group);
    const tracks=[
        ...sr.map((row,i)=>({row,t:artist.singles[i],album:null})),
        ...boxes.flatMap((b,i)=>b.api.rows.map((row,j)=>({row,t:artist.albums[i].tracks[j],album:b.api})))];
    return{group,artist,set,wrap,albums:boxes.map(b=>b.api),tracks,auto:[]};
}

(async()=>{
    const FIRST=5;
    const list=document.getElementById("artistList");
    const searchEl=document.getElementById("search");
    const artists=merge(await Promise.all([load("library.json"),load("library.auto.json")]));
    if(!artists.length){list.appendChild(el("div","empty","LIBRARY NOT FOUND - open the site through GitHub Pages or a local server."));return}

    const items=artists.map(a=>renderArtist(a,list));
    const noRes=el("div","empty","");noRes.style.display="none";
    const moreBtn=el("button","view-more more-artists","MORE ARTISTS");moreBtn.type="button";
    list.after(noRes);noRes.after(moreBtn);
    let showingAll=false;

    // default view: first 5 artists + MORE button
    function showDefault(){
        noRes.style.display="none";
        items.forEach((it,i)=>{
            it.group.style.display=(i<FIRST||showingAll)?"":"none";
        });
        moreBtn.style.display=(!showingAll&&items.length>FIRST)?"":"none";
    }

    moreBtn.addEventListener("click",()=>{
        showingAll=true;
        items.forEach((it,i)=>{
            if(i<FIRST)return;
            it.group.style.display="";
            it.group.style.animationDelay=((i-FIRST)*0.07)+"s";
            it.group.classList.remove("fade-in");void it.group.offsetWidth;
            it.group.classList.add("fade-in");
        });
        moreBtn.style.display="none";
    });
    showDefault();

    function run(raw){
        try{
            // reset previous search state
            items.forEach(it=>{
                it.auto.forEach(f=>f(false));it.auto=[];
                it.tracks.forEach(x=>x.row.classList.remove("hit"));
                it.group.classList.remove("fade-in");it.group.style.animationDelay="";
            });
            const q=norm(raw);

            if(q.length<2){
                list.append(...items.map(i=>i.group));   // original order
                showDefault();
                return;
            }

            const open=(it,set,wrap)=>{if(!wrap.classList.contains("open")){set(true);it.auto.push(set)}};
            items.forEach(it=>{
                const sName=Math.max(...[it.artist.name,...(it.artist.aliases||[])].map(n=>score(q,n)));
                it.albums.forEach(b=>b.s=score(q,b.title));
                it.tracks.forEach(x=>x.s=Math.max(score(q,x.t.title),.85*score(q,x.t.artist||"")));
                const sAlb=Math.max(0,...it.albums.map(b=>b.s*.95)),sTr=Math.max(0,...it.tracks.map(x=>x.s));
                it.score=Math.max(sName,sAlb,sTr);
                if(it.score>=.6&&sName<Math.max(sAlb,sTr)){
                    const min=Math.max(.6,it.score-.1);
                    open(it,it.set,it.wrap);
                    it.tracks.forEach(x=>{if(x.s>=min){x.row.classList.add("hit");x.album&&open(it,x.album.set,x.album.wrap)}});
                    it.albums.forEach(b=>{if(b.s*.95>=min)open(it,b.set,b.wrap)});
                }
            });
            const hits=items.filter(i=>i.score>=.6).sort((a,b)=>b.score-a.score);
            const rest=items.filter(i=>i.score<.6);
            hits.forEach(i=>i.group.style.display="");
            rest.forEach(i=>i.group.style.display="none");
            list.append(...hits.map(i=>i.group),...rest.map(i=>i.group));
            noRes.textContent=hits.length?"":"NOTHING FOUND - TRY FEWER LETTERS";
            noRes.style.display=hits.length?"none":"";
            moreBtn.style.display="none";        // searching always searches ALL artists
        }catch(err){
            console.error("Search error",err);
        }
    }

    let timer;
    searchEl.addEventListener("input",e=>{
        clearTimeout(timer);
        timer=setTimeout(()=>run(e.target.value),120);
    });
    // run once in case the browser restored text into the box on reload
    if(searchEl.value) run(searchEl.value);
})();

/* ---------- Mini Player Controls & Full Screen Event ---------- */
miniPlay.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(!cur)return;
    if(A.paused) A.play(); else A.pause();
});

miniNext.addEventListener("click",(e)=>{
    e.stopPropagation();
    if(!cur)return;
    const n=cur.row.nextRow;
    if(n) n.start(); else {
        A.pause(); cur.reset(); cur=null; updateUI();
    }
});

miniPlayer.addEventListener("click", () => {
    if(cur) {
        fullPlayer.classList.add("show");
        fullPlayer.setAttribute("aria-hidden", "false");
    }
});

fpClose.addEventListener("click", () => {
    fullPlayer.classList.remove("show");
    fullPlayer.setAttribute("aria-hidden", "true");
});

fpPlay.addEventListener("click", () => {
    if(!cur) return;
    if(A.paused) A.play(); else A.pause();
});

fpNext.addEventListener("click", () => {
    if(!cur) return;
    const n = cur.row.nextRow;
    if(n) n.start();
});

fpPrev.addEventListener("click", () => {
    if(!cur) return;
    if (A.currentTime > 3) {
        A.currentTime = 0;
    } else {
        const p = cur.row.prevRow;
        if (p) p.start();
    }
});

fpRange.addEventListener("input", (e) => {
    fill(fpRange);
    if(cur && A.duration) {
        A.currentTime = e.target.value / 1000 * A.duration;
    }
});

/* ---------- swipe-to-dismiss Telegram notice ---------- */
(function(){
    const tg=document.getElementById("tg");if(!tg)return;
    const KEY="arsx-tg-dismissed";
    try{const t=+localStorage.getItem(KEY);if(t&&Date.now()-t<7*864e5){tg.remove();return}}catch(e){}
    setTimeout(()=>tg.classList.add("show"),1200);
    let x0=0,dx=0,moved=false;
    const move=d=>{tg.style.setProperty("--dx",d+"px");tg.style.opacity=Math.max(0,1-Math.abs(d)/(innerWidth*.5))};
    const onMove=e=>{dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;move(dx)};
    const onUp=()=>{
        removeEventListener("pointermove",onMove);removeEventListener("pointerup",onUp);removeEventListener("pointercancel",onUp);
        tg.classList.remove("drag");
        if(Math.abs(dx)>70){
            const dir=dx>0?1:-1;
            tg.style.setProperty("--dx",dir*innerWidth+"px");tg.style.opacity=0;
            try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}
            setTimeout(()=>tg.remove(),500);
        }else{tg.style.setProperty("--dx","0px");tg.style.opacity=""}
    };
    tg.addEventListener("pointerdown",e=>{
        if(e.pointerType==="mouse"&&e.button!==0)return;
        x0=e.clientX;dx=0;moved=false;tg.classList.add("drag");
        addEventListener("pointermove",onMove);addEventListener("pointerup",onUp);addEventListener("pointercancel",onUp);
    });
    tg.addEventListener("click",e=>{if(moved){e.preventDefault();moved=false}},true);
    addEventListener("keydown",e=>{if(e.key==="Escape"&&tg.isConnected){dx=100;onUp()}});
})();
</script>
